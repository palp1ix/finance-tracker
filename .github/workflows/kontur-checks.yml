name: Kontur checks
on:
  pull_request:
    paths:
      - 'kontur/**'
      - '.github/workflows/kontur-checks.yml'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: kontur
      - run: npm run build
        working-directory: kontur
